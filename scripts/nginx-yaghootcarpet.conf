# Redirect www -> apex
server {
    listen 80;
    listen [::]:80;
    server_name www.yaghootcarpet.com;
    return 301 https://yaghootcarpet.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yaghootcarpet.com;

    ssl_certificate /etc/letsencrypt/live/yaghootcarpet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaghootcarpet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yaghootcarpet.com$request_uri;
}

# HTTP apex -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yaghootcarpet.com;
    return 301 https://yaghootcarpet.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yaghootcarpet.com;

    ssl_certificate /etc/letsencrypt/live/yaghootcarpet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaghootcarpet.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;

    # Next static assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded images — serve from persistent disk (not via Next)
    location /uploads/ {
        alias /srv/yaghoot/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
